@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md">
    <div class="w-full max-w-md p-6 sm:p-8 rounded-3xl glass-panel shadow-glow border border-emerald-500/20 animate-in fade-in zoom-in duration-200">
      <div class="flex items-center justify-between mb-6 pb-3 border-b border-slate-800">
        <div>
          <h2 class="text-xl font-bold text-white tracking-tight">Staff Account Settings</h2>
          <p class="text-xs text-slate-400 mt-0.5">Manage your operator name and security</p>
        </div>
        <button (click)="close.emit()" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition-colors">
          <lucide-icon [name]="'x'" class="w-5 h-5"></lucide-icon>
        </button>
      </div>

      <form (ngSubmit)="handleSave()" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Display Name</label>
          <input 
            type="text" 
            [(ngModel)]="fullName" 
            name="fullName"
            placeholder="Agent Smith" 
            class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/90 border border-slate-800 text-white text-sm focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20" 
          />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">New Password (Optional)</label>
          <input 
            type="password" 
            [(ngModel)]="newPassword" 
            name="newPassword"
            placeholder="Leave blank to keep unchanged" 
            class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/90 border border-slate-800 text-white text-sm focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20" 
          />
        </div>

        @if (profile(); as p) {
          <div class="p-3 rounded-xl bg-slate-900/60 border border-white/5 flex items-center justify-between text-xs text-slate-400">
            <span>Assigned Role:</span>
            <span class="font-semibold capitalize text-emerald-400">{{ p.role }}</span>
          </div>
        }

        <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-800">
          <button type="button" (click)="close.emit()" class="px-4 py-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 text-xs font-medium transition-colors">Cancel</button>
          <button type="submit" [disabled]="saving()" class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium transition-all shadow-md shadow-emerald-600/20 disabled:opacity-50">
            {{ saving() ? 'Saving...' : 'Update Settings' }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
