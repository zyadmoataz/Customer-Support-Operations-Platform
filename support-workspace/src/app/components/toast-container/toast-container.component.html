<div class="fixed top-5 right-5 z-50 flex flex-col gap-2.5 max-w-sm w-full pointer-events-none px-4 sm:px-0">
  @for (toast of toastService.toasts(); track toast.id) {
    <div 
      [class]="'pointer-events-auto flex items-center justify-between gap-3 px-4 py-3 rounded-2xl shadow-xl backdrop-blur-xl border transition-all duration-300 animate-in fade-in slide-in-from-top-2 ' + getStyles(toast.type)"
    >
      <div class="flex items-center gap-2.5">
        @if (toast.type === 'success') {
          <div class="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center flex-shrink-0">
            <lucide-icon [name]="'check'" class="w-3.5 h-3.5"></lucide-icon>
          </div>
        } @else if (toast.type === 'error') {
          <div class="w-6 h-6 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center flex-shrink-0">
            <lucide-icon [name]="'alert-circle'" class="w-3.5 h-3.5"></lucide-icon>
          </div>
        } @else {
          <div class="w-6 h-6 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center flex-shrink-0">
            <lucide-icon [name]="'info'" class="w-3.5 h-3.5"></lucide-icon>
          </div>
        }
        <span class="text-xs font-semibold text-white tracking-wide leading-tight">{{ toast.message }}</span>
      </div>

      <button 
        (click)="toastService.dismiss(toast.id)"
        class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-white/10 transition-colors"
        title="Dismiss"
      >
        <lucide-icon [name]="'x'" class="w-3.5 h-3.5"></lucide-icon>
      </button>
    </div>
  }
</div>
