<!-- Mobile Top Navigation Bar (Shown on < lg screens) -->
<div class="lg:hidden sticky top-0 z-40 w-full h-16 bg-brand-bg/95 backdrop-blur-md border-b border-brand-border px-4 flex items-center justify-between">
  <div class="flex items-center gap-2.5">
    <div class="flex items-center justify-center w-8 h-8 rounded-xl bg-gradient-to-tr from-state-success to-state-info shadow-glow text-text-primary font-bold">
      <lucide-icon [name]="'headphones'" class="w-4 h-4"></lucide-icon>
    </div>
    <span class="font-bold text-text-primary text-base tracking-tight">Optima</span>
  </div>

  <button
    (click)="isMobileOpen.set(!isMobileOpen())"
    class="p-2 rounded-xl bg-brand-surface border border-brand-border text-text-secondary hover:text-text-primary"
    aria-label="Toggle Navigation"
  >
    <lucide-icon [name]="isMobileOpen() ? 'x' : 'menu'" class="w-5 h-5"></lucide-icon>
  </button>
</div>

<!-- Mobile Drawer Backdrop -->
@if (isMobileOpen()) {
  <div
    (click)="isMobileOpen.set(false)"
    class="lg:hidden fixed inset-0 z-40 bg-brand-bg/90 backdrop-blur-sm transition-opacity"
  ></div>
}

<!-- Fixed Desktop Sidebar -->
<aside
  [class]="'fixed lg:sticky top-0 left-0 z-50 w-64 h-screen bg-brand-bg border-r border-brand-border/80 flex flex-col justify-between p-5 sm:p-6 flex-shrink-0 transition-transform duration-300 ease-in-out ' + (isMobileOpen() ? 'translate-x-0' : '-translate-x-full lg:translate-x-0')"
>
  <div>
    <!-- Logo & Brand Header -->
    <div class="flex items-center justify-between px-1 mb-8">
      <div class="flex items-center gap-3">
        <div class="flex items-center justify-center w-10 h-10 rounded-2xl bg-gradient-to-tr from-state-success via-state-success to-state-info shadow-glow text-text-primary font-bold flex-shrink-0">
          <lucide-icon [name]="'headphones'" class="w-5 h-5 text-text-primary"></lucide-icon>
        </div>
        <span class="font-extrabold text-text-primary text-xl tracking-tight">Optima</span>
      </div>
      <button (click)="isMobileOpen.set(false)" class="lg:hidden text-text-tertiary hover:text-text-primary p-1">
        <lucide-icon [name]="'x'" class="w-5 h-5"></lucide-icon>
      </button>
    </div>

    <!-- User Profile Pill -->
    <div class="p-3.5 rounded-2xl bg-brand-surface border border-brand-border/80 mb-6 flex items-center gap-3 shadow-md shadow-brand-bg/50">
      <div class="w-9 h-9 rounded-xl bg-state-success-bg text-state-success flex items-center justify-center font-bold text-sm border border-state-success flex-shrink-0">
        {{ profile()?.full_name?.charAt(0)?.toUpperCase() || 'S' }}
      </div>
      <div class="overflow-hidden">
        <p class="text-xs font-bold text-text-primary truncate">{{ profile()?.full_name || 'Staff Member' }}</p>
        <span class="text-[10px] text-text-tertiary font-medium">
          {{ profile()?.role === 'manager' ? 'Operations Manager' : 'Support Specialist' }}
        </span>
      </div>
    </div>

    <!-- Navigation Links -->
    <nav class="space-y-1.5">
      <button
        (click)="selectTab('queue')"
        [class]="'w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all ' + (activeTab() === 'queue' ? 'bg-state-success text-text-primary shadow-md shadow-none' : 'text-text-tertiary hover:text-text-primary hover:bg-brand-surface')"
      >
        <lucide-icon [name]="'inbox'" class="w-4 h-4"></lucide-icon>
        <span>Triage Queue</span>
      </button>

      <button
        (click)="selectTab('analytics')"
        [class]="'w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all ' + (activeTab() === 'analytics' ? 'bg-state-success text-text-primary shadow-md shadow-none' : 'text-text-tertiary hover:text-text-primary hover:bg-brand-surface')"
      >
        <lucide-icon [name]="'bar-chart-3'" class="w-4 h-4"></lucide-icon>
        <span>Ops Analytics</span>
      </button>

      @if (profile()?.role === 'manager') {
        <button
          (click)="selectTab('staff')"
          [class]="'w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all ' + (activeTab() === 'staff' ? 'bg-state-success text-text-primary shadow-md shadow-none' : 'text-text-tertiary hover:text-text-primary hover:bg-brand-surface')"
        >
          <lucide-icon [name]="'users'" class="w-4 h-4"></lucide-icon>
          <span>Staff Directory</span>
        </button>
      }

      <button
        (click)="selectTab('settings')"
        [class]="'w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all ' + (activeTab() === 'settings' ? 'bg-state-success text-text-primary shadow-md shadow-none' : 'text-text-tertiary hover:text-text-primary hover:bg-brand-surface')"
      >
        <lucide-icon [name]="'settings'" class="w-4 h-4"></lucide-icon>
        <span>Account & Security</span>
      </button>
    </nav>
  </div>

  <!-- Sign Out Button -->
  <div class="pt-4 border-t border-brand-border">
    <button
      (click)="signOut.emit()"
      class="w-full flex items-center justify-center gap-2 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-state-danger hover:text-text-primary hover:bg-state-danger-bg border border-state-danger transition-all shadow-sm"
    >
      <lucide-icon [name]="'log-out'" class="w-4 h-4"></lucide-icon>
      <span>Sign Out</span>
    </button>
  </div>
</aside>
