<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
  <div class="p-4 sm:p-6 rounded-3xl bg-brand-surface/90 border border-brand-border shadow-xl shadow-brand-bg/50 transition-all duration-300 hover:-translate-y-1 hover:border-brand-primary/60 hover:shadow-glow flex flex-col justify-between">
    <div class="flex items-center justify-between mb-3">
      <span class="text-xs font-bold uppercase tracking-wider text-text-tertiary">{{ stat1Label() }}</span>
      <div class="p-2.5 rounded-xl bg-brand-primary/10 text-brand-primary border border-brand-primary/20">
        <lucide-icon [name]="'inbox'" class="w-4 h-4"></lucide-icon>
      </div>
    </div>
    <div>
      <div class="text-2xl sm:text-3xl font-extrabold text-text-primary tracking-tight">{{ stat1Value() }}</div>
      <span class="text-xs text-text-tertiary font-medium mt-1 block">{{ stat1Subtext() }}</span>
    </div>
  </div>

  <div class="p-4 sm:p-6 rounded-3xl bg-brand-surface/90 border border-brand-border shadow-xl shadow-brand-bg/50 transition-all duration-300 hover:-translate-y-1 hover:border-state-warning/50 flex flex-col justify-between">
    <div class="flex items-center justify-between mb-3">
      <span class="text-xs font-bold uppercase tracking-wider text-text-tertiary">{{ stat2Label() }}</span>
      <div class="p-2.5 rounded-xl bg-state-warning-bg/40 text-state-warning border border-state-warning/20">
        <lucide-icon [name]="'clock'" class="w-4 h-4"></lucide-icon>
      </div>
    </div>
    <div>
      <div class="text-2xl sm:text-3xl font-extrabold text-text-primary tracking-tight">{{ stat2Value() }}</div>
      <span class="text-xs text-text-tertiary font-medium mt-1 block">{{ stat2Subtext() }}</span>
    </div>
  </div>

  <div class="p-4 sm:p-6 rounded-3xl bg-brand-surface/90 border border-brand-border shadow-xl shadow-brand-bg/50 transition-all duration-300 hover:-translate-y-1 hover:border-state-success/50 flex flex-col justify-between">
    <div class="flex items-center justify-between mb-3">
      <span class="text-xs font-bold uppercase tracking-wider text-text-tertiary">{{ stat3Label() }}</span>
      <div class="p-2.5 rounded-xl bg-state-success-bg/40 text-state-success border border-state-success/20">
        <lucide-icon [name]="'check-circle-2'" class="w-4 h-4"></lucide-icon>
      </div>
    </div>
    <div>
      <div class="text-2xl sm:text-3xl font-extrabold text-text-primary tracking-tight">{{ stat3Value() }}</div>
      <span class="text-xs text-text-tertiary font-medium mt-1 block">{{ stat3Subtext() }}</span>
    </div>
  </div>

  <div class="p-4 sm:p-6 rounded-3xl bg-brand-surface/90 border border-brand-border shadow-xl shadow-brand-bg/50 transition-all duration-300 hover:-translate-y-1 hover:border-brand-accent/50 flex flex-col justify-between">
    <div class="flex items-center justify-between mb-3">
      <span class="text-xs font-bold uppercase tracking-wider text-text-tertiary">{{ stat4Label() }}</span>
      <div class="p-2.5 rounded-xl bg-brand-accent/10 text-brand-accent border border-brand-accent/20">
        <lucide-icon [name]="'star'" class="w-4 h-4"></lucide-icon>
      </div>
    </div>
    <div>
      <div class="text-2xl sm:text-3xl font-extrabold text-text-primary tracking-tight">{{ stat4Value() }}</div>
      <span class="text-xs text-text-tertiary font-medium mt-1 block">{{ stat4Subtext() }}</span>
    </div>
  </div>
</div>
