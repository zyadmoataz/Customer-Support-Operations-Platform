@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-md">
    <div class="w-full max-w-md p-5 sm:p-6 rounded-3xl glass-panel shadow-glow border border-state-warning max-h-[92vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-4 pb-3 border-b border-brand-border">
        <div>
          <h3 class="text-base font-bold text-text-primary tracking-tight">Manager QA & Performance Rating</h3>
          <p class="text-xs text-text-tertiary mt-0.5">Rate agent resolution and provide constructive feedback</p>
        </div>
        <button (click)="close.emit()" class="text-text-tertiary hover:text-text-primary p-1 rounded-lg hover:bg-brand-elevated">
          <lucide-icon [name]="'x'" class="w-4 h-4"></lucide-icon>
        </button>
      </div>

      <div class="space-y-4">
        <!-- 1 to 5 Star Rating Selection -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-text-tertiary mb-2">
            Performance Score (1 - 5 Stars)
          </label>
          <div class="flex items-center gap-2">
            @for (star of [1, 2, 3, 4, 5]; track star) {
              <button
                type="button"
                (click)="rating.set(star)"
                class="p-1 rounded-lg hover:bg-brand-elevated transition-transform hover:scale-110 focus:outline-none"
              >
                <lucide-icon
                  [name]="'star'"
                  [class]="'w-6 h-6 ' + (rating() >= star ? 'text-state-warning text-state-warning' : 'text-text-muted')"
                ></lucide-icon>
              </button>
            }
            <span class="ml-2 text-xs font-bold text-state-warning">{{ rating() }} / 5 Stars</span>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-text-tertiary mb-1.5">
            Manager Review Comment / Coaching Notes
          </label>
          <textarea
            [(ngModel)]="feedback"
            rows="3"
            placeholder="e.g. Great speed! Next time, provide an FAQ link for self-service."
            class="w-full px-3.5 py-2.5 rounded-xl bg-brand-surface/90 border border-brand-border text-text-primary text-xs placeholder-text-muted focus:outline-none focus:border-state-warning"
          ></textarea>
        </div>

        <div class="flex items-center justify-end gap-2 pt-3 border-t border-brand-border">
          <button (click)="close.emit()" class="px-3 py-1.5 rounded-xl text-text-tertiary hover:text-text-primary text-xs font-medium">Cancel</button>
          <button
            (click)="handleConfirm()"
            [disabled]="!feedback.trim()"
            class="px-4 py-2 rounded-xl bg-state-warning hover:bg-state-warning text-text-primary text-xs font-semibold shadow-md shadow-none disabled:opacity-50"
          >
            Save Rating & Feedback
          </button>
        </div>
      </div>
    </div>
  </div>
}
