@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-md">
    <div class="w-full max-w-md p-5 sm:p-6 rounded-3xl glass-panel shadow-glow border border-state-success max-h-[92vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-4 pb-3 border-b border-brand-border">
        <div>
          <h3 class="text-base font-bold text-text-primary tracking-tight">Submit Ticket Resolution</h3>
          <p class="text-xs text-text-tertiary mt-0.5">Explain what steps were taken to resolve this issue</p>
        </div>
        <button (click)="close.emit()" class="text-text-tertiary hover:text-text-primary p-1 rounded-lg hover:bg-brand-elevated">
          <lucide-icon [name]="'x'" class="w-4 h-4"></lucide-icon>
        </button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-text-tertiary mb-1.5">
            Resolution Summary / Actions Taken
          </label>
          <textarea
            [(ngModel)]="note"
            rows="3"
            placeholder="e.g. Reissued account verification link and confirmed customer was able to log in successfully."
            class="w-full px-3.5 py-2.5 rounded-xl bg-brand-surface/90 border border-brand-border text-text-primary text-xs placeholder-text-muted focus:outline-none focus:border-state-success"
          ></textarea>
        </div>

        <p class="text-[11px] text-state-warning/90 bg-state-warning-bg p-2.5 rounded-xl border border-state-warning">
          Note: Once marked as resolved, this ticket status becomes locked and unchangeable.
        </p>

        <div class="flex items-center justify-end gap-2 pt-3 border-t border-brand-border">
          <button (click)="close.emit()" class="px-3 py-1.5 rounded-xl text-text-tertiary hover:text-text-primary text-xs font-medium">Cancel</button>
          <button
            (click)="handleConfirm()"
            [disabled]="!note.trim() || submitting()"
            class="px-4 py-2 rounded-xl bg-state-success hover:bg-state-success text-text-primary text-xs font-semibold shadow-md shadow-none disabled:opacity-50"
          >
            {{ submitting() ? 'Saving...' : 'Lock & Resolve Ticket' }}
          </button>
        </div>
      </div>
    </div>
  </div>
}
