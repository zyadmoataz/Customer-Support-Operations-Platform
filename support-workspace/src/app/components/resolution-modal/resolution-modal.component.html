@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-md">
    <div class="w-full max-w-md p-5 sm:p-6 rounded-3xl glass-panel shadow-glow border border-emerald-500/30 max-h-[92vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800">
        <div>
          <h3 class="text-base font-bold text-white tracking-tight">Submit Ticket Resolution</h3>
          <p class="text-xs text-slate-400 mt-0.5">Explain what steps were taken to resolve this issue</p>
        </div>
        <button (click)="close.emit()" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800">
          <lucide-icon [name]="'x'" class="w-4 h-4"></lucide-icon>
        </button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">
            Resolution Summary / Actions Taken
          </label>
          <textarea
            [(ngModel)]="note"
            rows="3"
            placeholder="e.g. Reissued account verification link and confirmed customer was able to log in successfully."
            class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/90 border border-slate-800 text-white text-xs placeholder-slate-500 focus:outline-none focus:border-emerald-500"
          ></textarea>
        </div>

        <p class="text-[11px] text-amber-400/90 bg-amber-950/30 p-2.5 rounded-xl border border-amber-500/20">
          Note: Once marked as resolved, this ticket status becomes locked and unchangeable.
        </p>

        <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-800">
          <button (click)="close.emit()" class="px-3 py-1.5 rounded-xl text-slate-400 hover:text-white text-xs font-medium">Cancel</button>
          <button
            (click)="handleConfirm()"
            [disabled]="!note.trim() || submitting()"
            class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold shadow-md shadow-emerald-600/20 disabled:opacity-50"
          >
            {{ submitting() ? 'Saving...' : 'Lock & Resolve Ticket' }}
          </button>
        </div>
      </div>
    </div>
  </div>
}
