<header class="sticky top-0 z-30 w-full border-b border-emerald-500/10 bg-slate-950/90 backdrop-blur-xl">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="flex items-center justify-center w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 shadow-md shadow-emerald-500/20 text-white font-bold text-sm">
        <lucide-icon [name]="'headphones'" class="w-5 h-5"></lucide-icon>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-semibold text-white tracking-tight text-sm sm:text-base">Support Operations</span>
          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
            Staff Workspace
          </span>
        </div>
        <p class="text-[11px] text-slate-400 hidden sm:block">Queue Management & Triage Console</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      @if (profile(); as p) {
        <button 
          (click)="profileClick.emit()"
          class="hidden md:flex items-center gap-2.5 pl-3 border-l border-slate-800 text-left hover:opacity-80 transition-opacity"
          title="Edit Staff Profile & Settings"
        >
          <div class="text-right">
            <p class="text-xs text-white font-medium capitalize">{{ p.full_name || 'Support Agent' }}</p>
            <p class="text-[10px] text-emerald-400 font-semibold uppercase tracking-wider">{{ p.role }} • Settings ⚙️</p>
          </div>
          <div class="w-8 h-8 rounded-full bg-emerald-950/80 border border-emerald-500/30 flex items-center justify-center text-xs text-emerald-300 font-bold uppercase">
            {{ p.full_name[0] || 'A' }}
          </div>
        </button>
      }

      <button
        (click)="signOut.emit()"
        class="flex items-center gap-1.5 p-2 sm:px-3 sm:py-2 rounded-xl border border-slate-800 text-slate-400 hover:text-white hover:bg-slate-900 transition-colors text-xs font-medium"
        title="Sign Out"
      >
        <span class="hidden sm:inline">Sign Out</span>
        <lucide-icon [name]="'log-out'" class="w-4 h-4"></lucide-icon>
      </button>
    </div>
  </div>
</header>
